name: test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: perl ${{ matrix.perl }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        perl: ["5.10", "5.16", "5.22", "5.28", "5.34", "5.40"]
        include:
          - os: macos-latest
            perl: "5.40"
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - name: Install dependencies
        # A checkout has no META.json, so cpanm cannot see configure_requires;
        # upgrade MakeMaker first (Perl 5.10 ships one that writes no MYMETA).
        run: |
          cpanm --notest ExtUtils::MakeMaker
          cpanm --notest --installdeps .
      - name: Run tests
        run: prove -lv t

  release:
    name: release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"
      - name: Install dependencies
        run: cpanm --notest --installdeps . && cpanm --notest Test::Pod
      - name: Build and test the distribution
        env:
          RELEASE_TESTING: 1
        run: |
          perl Makefile.PL
          make distcheck 2>&1 | tee distcheck.log
          ! grep -q "^Not in MANIFEST" distcheck.log
          make disttest

  single-file:
    name: single-file build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"
      - name: Build dist/dapper
        run: perl packaging/fatpack.pl
      - name: Run it with only core Perl modules
        run: |
          mkdir site && cd site
          PERL5LIB= /usr/bin/perl ../dist/dapper -v
          PERL5LIB= /usr/bin/perl ../dist/dapper -q init --template blog
          PERL5LIB= /usr/bin/perl ../dist/dapper check
          PERL5LIB= /usr/bin/perl ../dist/dapper -q build
          test -f _output/index.html

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t dapper:test .
      - name: Run it
        run: |
          mkdir site
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD/site":/site dapper:test -q init --template blog
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD/site":/site dapper:test check
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD/site":/site dapper:test -q build
          test -f site/_output/index.html
